<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>Kontakt</title>

<style>
  :root {
    --yellow: #ffffff;
    --bg: #000000;
    --text-white: #ffffff;
    --gray-bg: #E5E5EA;
    --gray-text: #8E8E93;
    --ae-ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-white);
    font-family: -apple-system, "SF Pro Text", "SF Pro Display",
                 BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body.no-scroll {
    overflow: hidden;
  }

  /* ---------- Ambient Glow ---------- */

  .ambient-glow {
    position: fixed;
    top: -5%;
    right: -10%;
    width: 350px;
    height: 350px;
    background: rgba(255, 255, 255, 0.04);
    filter: blur(90px);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- Page ---------- */

  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 0 24px max(28px, env(safe-area-inset-bottom, 20px)) 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* ---------- General Animation ---------- */

  @keyframes aeReveal {
    0% {
      opacity: 0;
      transform: translateY(16px);
    }

    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ---------- Header ---------- */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0 16px 0;
    animation: aeReveal 0.6s var(--ae-ease) forwards;
    position: relative;
    z-index: 2001;
  }

  .logo {
    display: flex;
    align-items: center;
    height: 26px;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  body.menu-open .logo {
    opacity: 0;
    visibility: hidden;
  }

  .logo img {
    height: 26px;
    width: auto;
    display: block;
  }

  /* ---------- Burger Menu ---------- */

  .burger-menu {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 20px;
    height: 14px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 2002;
    position: relative;
  }

  /* Powiększenie obszaru kliknięcia/dotyku bez zmiany wielkości wizualnej */
  .burger-menu::before {
    content: '';
    position: absolute;
    top: -15px;
    bottom: -15px;
    left: -12px;
    right: -12px;
  }

  .burger-menu span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: #ffffff;
    border-radius: 4px;
    transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
  }

  .burger-menu.is-open span:nth-child(1) {
    transform: translateY(6px) rotate(45deg);
  }

  .burger-menu.is-open span:nth-child(2) {
    opacity: 0;
  }

  .burger-menu.is-open span:nth-child(3) {
    transform: translateY(-6px) rotate(-45deg);
  }

  /* ---------- Mobile Navigation ---------- */

  .mobile-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background-color: var(--bg);
    z-index: 1999;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;

    padding: 120px 0 0 32px;

    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);

    transition:
      opacity 0.4s var(--ae-ease),
      transform 0.4s var(--ae-ease);
  }

  .mobile-nav.is-open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .mobile-nav::before {
    content: "";
    position: absolute;
    top: -10%;
    right: -15%;
    width: 320px;
    height: 320px;
    background: rgba(255, 255, 255, 0.04);
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
  }

  .mobile-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: column;
    gap: 32px;

    text-align: left;
    position: relative;
    z-index: 1;
  }

  .mobile-nav-list li {
    opacity: 0;
    transform: translateY(16px);
    transition:
      opacity 0.4s ease,
      transform 0.4s ease;
  }

  .mobile-nav.is-open .mobile-nav-list li {
    opacity: 1;
    transform: translateY(0);
  }

  .mobile-nav.is-open .mobile-nav-list li:nth-child(1) {
    transition-delay: 0.08s;
  }

  .mobile-nav.is-open .mobile-nav-list li:nth-child(2) {
    transition-delay: 0.13s;
  }

  .mobile-nav.is-open .mobile-nav-list li:nth-child(3) {
    transition-delay: 0.18s;
  }

  .mobile-nav.is-open .mobile-nav-list li:nth-child(4) {
    transition-delay: 0.23s;
  }

  .mobile-nav-list a,
  .mobile-nav-list button {
    display: inline-block;
    color: var(--text-white);
    text-decoration: none;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;

    font-family: -apple-system, "SF Pro Display",
                 BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;

    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.5px;

    transition:
      opacity 0.2s ease,
      transform 0.2s ease;
  }

  .mobile-nav-list a:active,
  .mobile-nav-list button:active {
    opacity: 0.7;
    transform: scale(0.97);
  }

  .mobile-nav-list li.active a,
  .mobile-nav-list li.active button {
    color: var(--text-white);
  }

  /* ---------- Hero ---------- */

  .hero {
    margin-top: 20px;
    margin-bottom: 40px;

    opacity: 0;
    animation: aeReveal 0.6s var(--ae-ease) 0.1s forwards;
  }

  .hero h1 {
    color: var(--yellow);
    font-size: 32px;
    line-height: 1.15;
    font-weight: 600;
    white-space: nowrap;

    margin: 0;
    letter-spacing: -0.5px;
  }

  /* ---------- Selection summary ---------- */

  .selection-summary {
    margin: 0 0 28px 0;
    padding: 14px 16px;
    background: #0F0F0F;
    border-radius: 10px;
    font-size: 14px;
    color: #D9D9D9;
    line-height: 1.4;
    display: none;

    opacity: 0;
    animation: aeReveal 0.5s var(--ae-ease) 0.12s forwards;
  }

  .selection-summary b {
    color: #ffffff;
  }

  /* ---------- Form ---------- */

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 22px;
    flex-grow: 1;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
  }

  .field:nth-child(1) {
    animation: aeReveal 0.5s var(--ae-ease) 0.15s forwards;
  }

  .field:nth-child(2) {
    animation: aeReveal 0.5s var(--ae-ease) 0.22s forwards;
  }

  .field:nth-child(3) {
    animation: aeReveal 0.5s var(--ae-ease) 0.29s forwards;
  }

  .field:nth-child(4) {
    animation: aeReveal 0.5s var(--ae-ease) 0.36s forwards;
  }

  .field label {
    font-size: 17px;
    font-weight: 500;
    color: #D9D9D9;
    padding-left: 2px;
  }

  .field input,
  .field textarea {
    background: #0F0F0F;
    border: 1.5px solid transparent;
    border-radius: 8px;

    font-size: 16px;
    font-weight: 400;

    color: var(--text-white);
    font-family: inherit;

    outline: none;
    width: 100%;

    transition: border-color 0.2s ease;
    box-shadow: none;
  }

  .field input {
    height: 42px;
    padding: 0 16px;
  }

  .field textarea {
    resize: none;
    height: 130px;
    padding: 12px 16px;
    line-height: 1.4;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
    font-weight: 400;
  }

  .field input:focus,
  .field textarea:focus {
    border-color: transparent;
  }

  /* ---------- Submit Button ---------- */

  .submit-wrap {
    display: block;
    margin-top: 6px;
    width: 100%;

    opacity: 0;
    animation: aeReveal 0.5s var(--ae-ease) 0.4s forwards;
  }

  .submit-btn {
    width: 100%;
    height: 42px;

    background: #0071E3;
    color: #ffffff;

    border: none;
    border-radius: 8px;

    font-size: 17px;
    font-weight: 400;

    font-family: inherit;

    cursor: pointer;

    transition:
      background-color 0.3s ease,
      color 0.3s ease,
      opacity 0.2s ease;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 4px 15px rgba(0, 113, 227, 0.2);
  }

  .submit-btn.disabled-btn {
    background: #2B2B2B;
    color: #868686;
    cursor: not-allowed;
    box-shadow: none;
  }

  .submit-btn:not(.disabled-btn):hover {
    opacity: 0.92;
  }

  .submit-btn:not(.disabled-btn):active {
    opacity: 0.8;
  }

  .status-msg {
    text-align: center;
    font-size: 14px;
    font-weight: 400;

    margin-top: 14px;
    min-height: 18px;

    color: var(--yellow);

    transition: opacity 0.3s ease;
  }

  .status-msg.is-error {
    color: #FF6B6B;
  }

  /* ---------- Dot Field ---------- */

  .dot-field {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    height: min(65vh, 600px);

    z-index: 0;
    display: block;
    pointer-events: none;

    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.6) 30%,
      #000 80%
    );

    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.6) 30%,
      #000 80%
    );
  }

  /* ==========================================================
     DESKTOP
     ========================================================== */

  @media (min-width: 481px) {

    /* ---------- Desktop Header ---------- */

    .header {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: 24px 32px 16px 32px;
      align-items: center;
    }

    .logo {
      height: 26px;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 26px;
      width: auto;
      display: block;
    }

    .burger-menu {
      display: none;
    }

    /* ---------- Desktop Navigation ---------- */

    .mobile-nav {
      position: fixed;
      top: 24px;
      right: 32px;
      left: auto;
      width: auto;
      height: 28px;
      background: transparent;
      z-index: 2002;
      display: flex;
      align-items: center;
      padding: 0;
      opacity: 1;
      pointer-events: auto;
      transform: none;
      transition: none;
    }

    .mobile-nav::before {
      display: none;
    }

    .mobile-nav-list {
      flex-direction: row;
      align-items: center;
      gap: 52px;
      height: 28px;
    }

    .mobile-nav-list li {
      opacity: 1;
      transform: none;
      transition: none;
      display: flex;
      align-items: center;
      height: 28px;
    }

    .mobile-nav-list a,
    .mobile-nav-list button {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.2px;
      line-height: 28px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      transition: opacity 0.2s ease;
    }

    .mobile-nav-list a:hover,
    .mobile-nav-list button:hover {
      opacity: 0.7;
    }

    /* ---------- Desktop Page ---------- */

    .page {
      max-width: 920px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 32px 40px 32px;
    }

    /* ---------- Desktop Hero ---------- */

    .hero {
      margin-top: 100px;
      margin-bottom: 54px;
      text-align: center;
    }

    .hero h1 br {
      display: none;
    }

    .selection-summary {
      max-width: 414px;
      margin: 0 auto 37px auto;
    }

    /* ---------- Desktop Form ---------- */

    .contact-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 26px;
      row-gap: 29px;
      flex-grow: 0;
    }

    .field:nth-child(1) {
      grid-column: 1;
      grid-row: 1;
    }

    .field:nth-child(2) {
      grid-column: 2;
      grid-row: 1;
    }

    .field:nth-child(3) {
      grid-column: 1;
      grid-row: 2;
    }

    .field:nth-child(4) {
      grid-column: 1 / -1;
      grid-row: 3;
    }

    .field textarea {
      height: 180px;
    }

    .submit-wrap {
      grid-column: 1 / -1;
      grid-row: 4;
      width: 414px;
      margin: 23px auto 0 auto;
    }

    .status-msg {
      margin-top: 14px;
    }
  }
</style>

</head>

<body>

<div class="ambient-glow"></div>

<canvas
id="dotField"
class="dot-field"
aria-hidden="true"></canvas>

<div class="page">

  <header class="header">
    <div class="logo">
      <img
        src="https://uploads.onecompiler.io/44h4mcb6e/44uj3jqmd/Groupewqeqw%20267.png"
        alt="Logo"
      >
    </div>

    <button
      type="button"
      class="burger-menu"
      id="burger-toggle"
      aria-label="Otwórz menu"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <nav
    class="mobile-nav"
    id="mobile-nav"
    aria-hidden="true"
  >
    <ul class="mobile-nav-list">
      <li>
        <button type="button" onclick="window.location.href='index.html'">Start</button>
      </li>
      <li>
        <button type="button" onclick="window.location.href='portfolio.html'">Portfolio</button>
      </li>
      <li>
        <button type="button" onclick="window.location.href='oferta.html'">Oferta</button>
      </li>
      <li>
        <button type="button" onclick="closeMenu()">Kontakt</button>
      </li>
    </ul>
  </nav>

  <section class="hero">
    <h1>
      Skontaktuj się z nami:
    </h1>
  </section>

  <div class="selection-summary" id="selection-summary"></div>

  <form
    class="contact-form"
    id="contact-form"
  >
    <div class="field">
      <label for="name">
        Twoje imię
      </label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Twoje imię"
        required
      >
    </div>

    <div class="field">
      <label for="phone">
        Numer telefonu
      </label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Numer telefonu"
        required
      >
    </div>

    <div class="field">
      <label for="email">
        Email
      </label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email"
        required
      >
    </div>

    <div class="field">
      <label for="message">
        Wiadomość
      </label>
      <textarea
        id="message"
        name="message"
        placeholder="Twoja wiadomość..."
        required
      ></textarea>
    </div>

    <input type="hidden" name="_subject" value="Nowa wiadomość z formularza kontaktowego">

    <div
      class="submit-wrap"
      id="submit-wrap"
    >
      <button
        type="submit"
        class="submit-btn disabled-btn"
        id="submit-btn"
      >
        Wyślij
      </button>

      <div
        class="status-msg"
        id="status-msg"
      ></div>
    </div>
  </form>
</div>

<script>
  const burgerToggle = document.getElementById('burger-toggle');
  const mobileNav = document.getElementById('mobile-nav');
  const navButtons = mobileNav.querySelectorAll('.mobile-nav-list button');

  function openMenu() {
    burgerToggle.classList.add('is-open');
    mobileNav.classList.add('is-open');
    burgerToggle.setAttribute('aria-expanded', 'true');
    mobileNav.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    document.body.classList.add('menu-open');
  }

  function closeMenu() {
    burgerToggle.classList.remove('is-open');
    mobileNav.classList.remove('is-open');
    burgerToggle.setAttribute('aria-expanded', 'false');
    mobileNav.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    document.body.classList.remove('menu-open');
  }

  burgerToggle.addEventListener('click', function () {
    if (mobileNav.classList.contains('is-open')) {
      closeMenu();
    } else {
      openMenu();
    }
  });

  navButtons.forEach(function (btn) {
    btn.addEventListener('click', closeMenu);
  });

  // ---------- Podsumowanie wybranego pakietu (z oferta.html) ----------
  (function () {
    const params = new URLSearchParams(window.location.search);
    const usluga = params.get('usluga');
    const pakiet = params.get('pakiet');
    const cena = params.get('cena');
    const summaryEl = document.getElementById('selection-summary');

    if (usluga && pakiet) {
      summaryEl.style.display = 'block';
      summaryEl.innerHTML =
        '<b>Twój wybór:</b><br>' + usluga + ' — ' + pakiet + (cena ? ' (' + cena + ')' : '');
    }
  })();

  // ==================================================================
  // WYSYŁKA FORMULARZA — Formspree
  // ==================================================================
  const FORMSPREE_FORM_ID = 'mppzrzeb';
  const FORMSPREE_ENDPOINT = 'https://formspree.io/f/' + FORMSPREE_FORM_ID;

  const form = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const statusMsg = document.getElementById('status-msg');
  const submitWrap = document.getElementById('submit-wrap');
  const inputs = form.querySelectorAll('input[required], textarea[required]');

  function checkInput() {
    let allFilled = true;
    inputs.forEach(function (input) {
      if (input.value.trim().length === 0) {
        allFilled = false;
      }
    });

    submitBtn.classList.toggle('disabled-btn', !allFilled);
  }

  checkInput();

  inputs.forEach(function (input) {
    input.addEventListener('input', checkInput);
  });

  function showStatus(message, isError) {
    statusMsg.textContent = message;
    statusMsg.classList.toggle('is-error', !!isError);
    statusMsg.style.opacity = '1';

    setTimeout(function () {
      statusMsg.style.opacity = '0';
      setTimeout(function () {
        statusMsg.textContent = '';
        statusMsg.classList.remove('is-error');
        statusMsg.style.opacity = '1';
      }, 300);
    }, 4000);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (submitBtn.classList.contains('disabled-btn')) return;

    if (FORMSPREE_FORM_ID === 'YOUR_FORM_ID') {
      showStatus('Formularz nie jest jeszcze skonfigurowany (brak ID Formspree).', true);
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Wysyłanie...';

    const formData = new FormData(form);

    fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
      .then(function (response) {
        if (response.ok) {
          showStatus('Wiadomość została wysłana!', false);
          form.reset();
          checkInput();
        } else {
          return response.json().then(function (data) {
            const errMsg = (data && data.errors && data.errors.length)
              ? data.errors.map(function (er) { return er.message; }).join(', ')
              : 'Coś poszło nie tak. Spróbuj ponownie.';
            showStatus(errMsg, true);
          });
        }
      })
      .catch(function () {
        showStatus('Brak połączenia. Spróbuj ponownie.', true);
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Wyślij';
      });
  });
</script>

<script>
  (function () {
    var canvas = document.getElementById('dotField');
    if (!canvas || !canvas.getContext) {
      return;
    }

    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width = 0;
    var height = 0;
    var AMOUNTX = 65;
    var AMOUNTY = 50;
    var SEPARATION = 35;
    var RADIUS = 1.15;
    var count = 0;
    var interactionPulse = 0;
    var interactionFactor = 0;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var startTime = Date.now();
    var introDuration = 3500;

    window.triggerWaveInteraction = function () {
      interactionPulse = Math.min(interactionPulse + 0.6, 1.4);
    };

    document.addEventListener('input', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        window.triggerWaveInteraction();
      }
    });

    document.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target.closest('.submit-btn') || e.target.closest('.burger-menu')) {
        window.triggerWaveInteraction();
      }
    });

    function resize() {
      var rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    function draw() {
      ctx.clearRect(0, 0, width, height);
      var now = Date.now();
      var elapsed = now - startTime;
      var globalIntroProgress = Math.min(elapsed / introDuration, 1);
      var globalEase = 1 - Math.pow(1 - globalIntroProgress, 4);

      interactionPulse *= 0.9;
      interactionFactor += (interactionPulse - interactionFactor) * 0.07;

      var focalLength = 350;
      var cameraZ = 700 + (1 - globalEase) * 600;
      var cameraY = -50 - (1 - globalEase) * 200;
      var baseSpeed = reduceMotion ? 0.002 : 0.008;
      var speedMultiplier = 1 + (1 - globalEase) * 4;
      var currentSpeed = (baseSpeed + (interactionFactor * 0.004)) * speedMultiplier;

      count += currentSpeed;

      var ampBoost = 1 + (interactionFactor * 0.28);
      var introAmpBoost = 1 + (1 - globalEase) * 1.5;
      var spinAngle = (1 - globalEase) * -0.4;
      var cosA = Math.cos(spinAngle);
      var sinA = Math.sin(spinAngle);
      var maxDist = Math.sqrt(Math.pow(AMOUNTX / 2, 2) + Math.pow(AMOUNTY / 2, 2));

      for (var ix = 0; ix < AMOUNTX; ix++) {
        for (var iy = 0; iy < AMOUNTY; iy++) {
          var dx = ix - AMOUNTX / 2;
          var dy = iy - AMOUNTY / 2;
          var rawX = dx * SEPARATION;
          var rawZ = dy * SEPARATION;
          var x = cosA * rawX - sinA * rawZ;
          var z = sinA * rawX + cosA * rawZ;
          var distCenter = Math.sqrt(dx * dx + dy * dy);
          var distRatio = distCenter / maxDist;
          var particleProgress = Math.max(0, Math.min(1, (globalIntroProgress - distRatio * 0.25) / 0.75));
          var particleEase = 1 - Math.pow(1 - particleProgress, 4);

          var targetY = (Math.sin((ix * 0.25) + count) * 40 + Math.sin((iy * 0.2) + count * 0.8) * 40) * ampBoost * introAmpBoost;
          var introYOffset = (1 - particleEase) * 600;
          var y = targetY + introYOffset;
          var adjustedZ = z + cameraZ;

          if (adjustedZ > 0) {
            var scale = focalLength / adjustedZ;
            var px = (x * scale) + (width / 2);
            var py = ((y - cameraY) * scale) + (height / 2) - 100;

            if (px > -50 && px < width + 50 && py > -50 && py < height + 50) {
              var normalizedY = (y + 80) / 160;
              var shade = Math.round(255 - (normalizedY * 220));
              var baseAlpha = Math.max(0.1, 1.2 - (adjustedZ / 1000));
              var alpha = baseAlpha * particleEase;

              ctx.beginPath();
              ctx.fillStyle = 'rgba(' + shade + ', ' + shade + ', ' + shade + ', ' + alpha.toFixed(2) + ')';
              ctx.arc(px, py, RADIUS, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
</script>
