<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>Start</title>

<style>
  :root {
    --bg: #ffffff;
    --text-black: #000000;
    --blue: #0071E3;
    --ae-ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-black);
    font-family: -apple-system, "SF Pro Text", "SF Pro Display",
                 BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body.no-scroll {
    overflow: hidden;
  }

  /* ---------- Ambient Glow ---------- */

  .ambient-glow {
    position: fixed;
    top: -5%;
    right: -10%;
    width: 350px;
    height: 350px;
    background: rgba(0, 0, 0, 0.04);
    filter: blur(90px);
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
  }

  /* ---------- Page Layout ---------- */

  .page {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 0 24px max(24px, env(safe-area-inset-bottom, 24px)) 24px;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* ---------- General Animations ---------- */

  @keyframes aeReveal {
    0% { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Header ---------- */

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0 16px 0;
    animation: aeReveal 0.6s var(--ae-ease) forwards;
    position: relative;
    z-index: 2001;
  }

  .logo {
    display: flex;
    align-items: center;
    height: 26px;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }

  body.menu-open .logo {
    opacity: 0;
    visibility: hidden;
  }

  .logo img {
    height: 32px;
    width: auto;
    display: block;
  }

  /* ---------- Burger Menu ---------- */

  .burger-menu {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 16px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 2002;
    position: relative;
  }

  .burger-menu span {
    display: block;
    width: 100%;
    height: 2px;
    background-color: #000000;
    border-radius: 4px;
    transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.3s ease;
  }

  .burger-menu.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .burger-menu.is-open span:nth-child(2) { opacity: 0; }
  .burger-menu.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ---------- Mobile Navigation ---------- */

  .mobile-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100dvh;
    background-color: var(--bg);
    z-index: 1999;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 120px 0 0 32px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
    transition:
      opacity 0.4s var(--ae-ease),
      transform 0.4s var(--ae-ease);
  }

  .mobile-nav.is-open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .mobile-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 32px;
    text-align: left;
    position: relative;
    z-index: 1;
  }

  .mobile-nav-list li {
    opacity: 0;
    transform: translateY(16px);
    transition:
      opacity 0.4s ease,
      transform 0.4s ease;
  }

  .mobile-nav.is-open .mobile-nav-list li {
    opacity: 1;
    transform: translateY(0);
  }

  .mobile-nav.is-open .mobile-nav-list li:nth-child(1) { transition-delay: 0.08s; }
  .mobile-nav.is-open .mobile-nav-list li:nth-child(2) { transition-delay: 0.13s; }
  .mobile-nav.is-open .mobile-nav-list li:nth-child(3) { transition-delay: 0.18s; }
  .mobile-nav.is-open .mobile-nav-list li:nth-child(4) { transition-delay: 0.23s; }

  .mobile-nav-list a {
    display: inline-block;
    color: var(--text-black);
    text-decoration: none;
    font-family: -apple-system, "SF Pro Display",
                 BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.5px;
    transition:
      opacity 0.2s ease,
      transform 0.2s ease;
  }

  .mobile-nav-list a:active {
    opacity: 0.7;
    transform: scale(0.97);
  }

  /* ---------- Canvas Wave ---------- */

  .dot-field {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: min(65vh, 600px);
    z-index: 0;
    display: block;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.6) 30%,
      #000 80%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.6) 30%,
      #000 80%
    );
  }

  /* ==========================================================
     DESKTOP
     ========================================================== */

  @media (min-width: 481px) {

    .header {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: 24px 32px 16px 32px;
      align-items: center;
    }

    .burger-menu {
      display: none;
    }

    .mobile-nav {
      position: fixed;
      top: 24px;
      right: 32px;
      left: auto;
      width: auto;
      height: 28px;
      background: transparent;
      z-index: 2002;
      display: flex;
      align-items: center;
      padding: 0;
      opacity: 1;
      pointer-events: auto;
      transform: none;
      transition: none;
    }

    .mobile-nav-list {
      flex-direction: row;
      align-items: center;
      gap: 52px;
      height: 28px;
    }

    .mobile-nav-list li {
      opacity: 1;
      transform: none;
      transition: none;
    }

    .mobile-nav-list a {
      font-size: 15px;
      font-weight: 400;
      line-height: 28px;
    }

    .mobile-nav-list a:hover {
      opacity: 0.7;
    }

    .page {
      max-width: 920px;
      padding: 0 32px 32px 32px;
    }
  }
</style>

</head>

<body>

<div class="ambient-glow"></div>

<canvas id="dotField" class="dot-field" aria-hidden="true"></canvas>

<div class="page">

  <header class="header">

    <div class="logo">
      <img
        src="https://uploads.onecompiler.io/44h4mcb6e/44zaxcjz7/Group%204ewqeqwe39.png"
        alt="Logo"
      >
    </div>

    <button
      type="button"
      class="burger-menu"
      id="burger-toggle"
      aria-label="Otwórz menu"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

  </header>

  <!-- ---------- NAVIGATION ---------- -->

  <nav class="mobile-nav" id="mobile-nav" aria-hidden="true">
    <ul class="mobile-nav-list">
      <li><a href="index.html">Start</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="oferta.html">Oferta</a></li>
      <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
  </nav>

</div>

<script>
  const burgerToggle = document.getElementById('burger-toggle');
  const mobileNav = document.getElementById('mobile-nav');
  const navLinks = mobileNav.querySelectorAll('.mobile-nav-list a');

  function openMenu() {
    burgerToggle.classList.add('is-open');
    mobileNav.classList.add('is-open');
    burgerToggle.setAttribute('aria-expanded', 'true');
    mobileNav.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll', 'menu-open');
  }

  function closeMenu() {
    burgerToggle.classList.remove('is-open');
    mobileNav.classList.remove('is-open');
    burgerToggle.setAttribute('aria-expanded', 'false');
    mobileNav.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll', 'menu-open');
  }

  burgerToggle.addEventListener('click', () => {
    mobileNav.classList.contains('is-open') ? closeMenu() : openMenu();
  });

  navLinks.forEach(link => link.addEventListener('click', closeMenu));
</script>

<script>
  (function () {
    var canvas = document.getElementById('dotField');
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width = 0, height = 0;
    var AMOUNTX = 65, AMOUNTY = 50, SEPARATION = 35, RADIUS = 1.15;
    var count = 0, interactionPulse = 0, interactionFactor = 0;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var startTime = Date.now(), introDuration = 3500;

    window.triggerWaveInteraction = function () {
      interactionPulse = Math.min(interactionPulse + 0.6, 1.4);
    };

    document.addEventListener('click', function (e) {
      if (e.target.closest('.burger-menu') || e.target.closest('.mobile-nav-list a')) {
        window.triggerWaveInteraction();
      }
    });

    function resize() {
      var rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    function draw() {
      ctx.clearRect(0, 0, width, height);
      var now = Date.now();
      var elapsed = now - startTime;
      var globalIntroProgress = Math.min(elapsed / introDuration, 1);
      var globalEase = 1 - Math.pow(1 - globalIntroProgress, 4);

      interactionPulse *= 0.9;
      interactionFactor += (interactionPulse - interactionFactor) * 0.07;

      var focalLength = 350;
      var cameraZ = 700 + (1 - globalEase) * 600;
      var cameraY = -50 - (1 - globalEase) * 200;
      var baseSpeed = reduceMotion ? 0.002 : 0.008;
      var speedMultiplier = 1 + (1 - globalEase) * 4;
      var currentSpeed = (baseSpeed + (interactionFactor * 0.004)) * speedMultiplier;

      count += currentSpeed;

      var ampBoost = 1 + (interactionFactor * 0.28);
      var introAmpBoost = 1 + (1 - globalEase) * 1.5;
      var spinAngle = (1 - globalEase) * -0.4;
      var cosA = Math.cos(spinAngle);
      var sinA = Math.sin(spinAngle);
      var maxDist = Math.sqrt(Math.pow(AMOUNTX / 2, 2) + Math.pow(AMOUNTY / 2, 2));

      for (var ix = 0; ix < AMOUNTX; ix++) {
        for (var iy = 0; iy < AMOUNTY; iy++) {
          var dx = ix - AMOUNTX / 2;
          var dy = iy - AMOUNTY / 2;
          var rawX = dx * SEPARATION;
          var rawZ = dy * SEPARATION;
          var x = cosA * rawX - sinA * rawZ;
          var z = sinA * rawX + cosA * rawZ;
          var distCenter = Math.sqrt(dx * dx + dy * dy);
          var distRatio = distCenter / maxDist;
          var particleProgress = Math.max(0, Math.min(1, (globalIntroProgress - distRatio * 0.25) / 0.75));
          var particleEase = 1 - Math.pow(1 - particleProgress, 4);

          var targetY = (Math.sin((ix * 0.25) + count) * 40 + Math.sin((iy * 0.2) + count * 0.8) * 40) * ampBoost * introAmpBoost;
          var introYOffset = (1 - particleEase) * 600;
          var y = targetY + introYOffset;
          var adjustedZ = z + cameraZ;

          if (adjustedZ > 0) {
            var scale = focalLength / adjustedZ;
            var px = (x * scale) + (width / 2);
            var py = ((y - cameraY) * scale) + (height / 2) - 100;

            if (px > -50 && px < width + 50 && py > -50 && py < height + 50) {
              var normalizedY = (y + 80) / 160;
              var shade = Math.round(normalizedY * 80);
              var baseAlpha = Math.max(0.1, 1.2 - (adjustedZ / 1000));
              var alpha = baseAlpha * particleEase;

              ctx.beginPath();
              ctx.fillStyle = 'rgba(' + shade + ', ' + shade + ', ' + shade + ', ' + alpha.toFixed(2) + ')';
              ctx.arc(px, py, RADIUS, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
</script>

</body>
</html>
